project_id = "doorstep"

# Scalars first, then sub-tables. In TOML every key after a [section] header
# belongs to that section, so a sub-table dropped into the middle silently
# reassigns everything below it.
[auth]
# Where a sign-in link lands by default. Anything not listed below is refused,
# which is what stops a link being redirected somewhere it should not go.
site_url = "https://doorstep-9qi.pages.dev"
additional_redirect_urls = [
  "https://doorstep-9qi.pages.dev",
  "https://doorstep-9qi.pages.dev/**",
  "http://localhost:5180",
  "http://localhost:5180/**",
  "https://localhost:5181",
  "https://localhost:5181/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
# One sign-in email per address per minute. Left unset this defaults to a
# second, which turns the sign-in form into a way to bomb somebody's inbox:
# anyone can type an address they do not own and hold down the button.
max_frequency = "1m0s"
# There is no password to check a change of address against, so an email change
# has to be confirmed from both the old address and the new one.
double_confirm_changes = true
otp_length = 8
# Thirty minutes. An hour was generous to the wrong party: a sign-in link is a
# key to the account sitting in an inbox, and the longer it lies there the more
# chances there are for it to be read by somebody else. Thirty is long enough to
# find the email on a phone and short enough that a forwarded or leaked one is
# usually already dead.
otp_expiry = 1800

# Not used today, but left enrollable rather than switched off as a side effect
# of writing this file. Turning a capability off should be a decision.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# Mail.
#
# Supabase's built-in sender allows two auth emails an hour and is documented as
# not for production, and it refuses template changes on the free plan, which is
# why the sign-in email arrives unbranded. A custom SMTP provider fixes both.
#
# Brevo is the one set up here: 300 emails a day free, and it will verify a
# single address rather than needing a whole domain.
#
# To switch it on:
#   1. Sign up at brevo.com and verify pristineremodelco@gmail.com as a sender.
#   2. In Brevo, open SMTP & API and generate an SMTP key. The page shows a
#      login (an address ending @smtp-brevo.com) and the key itself.
#   3. Put both in your shell, so neither is ever written into this repo:
#        export DOORSTEP_SMTP_USER="the login from that page"
#        export DOORSTEP_SMTP_PASS="the key from that page"
#   4. Run ./tools/smtp-on.sh, which uncomments the two blocks below and pushes.
#      Doing it in one step matters: a push from a config with pieces missing
#      resets whatever it cannot see, which has already cost this project its
#      rate limits and its MFA setting once.
#
# [auth.email.smtp]
# enabled = true
# host = "smtp-relay.brevo.com"
# port = 587
# user = "env(DOORSTEP_SMTP_USER)"
# pass = "env(DOORSTEP_SMTP_PASS)"
# admin_email = "pristineremodelco@gmail.com"
# sender_name = "Doorstep"

# The branded email, leading with a code rather than a link. Supabase refuses
# template changes while the built-in sender is in use, so this can only be
# uncommented together with the block above.
#
# [auth.email.template.magic_link]
# subject = "Your Doorstep code"
# content_path = "./supabase/templates/magic_link.html"
